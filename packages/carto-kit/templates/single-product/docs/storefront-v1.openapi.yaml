openapi: 3.1.0
info:
  title: Carto Storefront API
  version: 1.0.0
  summary: Metered storefront API contract for self-hosted Carto SSR storefronts.
  description: |
    The Carto Storefront API is used by lightweight self-hosted SSR storefronts
    generated by Carto Kit or implemented by developers. Storefront servers call
    `/api/commerce/*` with a site-scoped server app token (`sk_live...`). The
    token lets Carto authenticate the site, meter API usage, apply plan limits,
    and revoke access without exposing credentials to the browser.
servers:
  - url: https://carto.example.com
    description: Production API base URL
  - url: http://localhost:4321
    description: Local development
tags:
  - name: SSR
    description: Server-to-Carto API for SSR storefront projects using `sk_live...` tokens.
  - name: Content
    description: Products and editable content blocks for the token-bound site.
  - name: Checkout
    description: Order and payment flow for storefront checkout.
paths:
  /api/commerce/config:
    get:
      tags: [SSR]
      summary: Read config using a server app token.
      description: Returns site metadata, GTM config, checkout copy, and browser-safe payment provider config. The site is inferred from the server app token.
      security:
        - ServerAppBearer: []
      responses:
        '200':
          description: Commerce config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommerceConfigResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/commerce/products:
    get:
      tags: [SSR]
      summary: List active products using a server app token.
      description: Lists active storefront-facing products for the token-bound site. Only active variants are returned.
      security:
        - ServerAppBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: tag
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Active product list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/commerce/products/{slug}:
    get:
      tags: [SSR]
      summary: Read one active product using a server app token.
      description: Reads one active product by slug for the token-bound site.
      security:
        - ServerAppBearer: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/commerce/blocks:
    get:
      tags: [SSR]
      summary: Read content blocks using a server app token.
      description: Reads blocks for the token-bound site. Use either `keys` for batch lookup by key, or `type` with optional pagination for list-by-type.
      security:
        - ServerAppBearer: []
      parameters:
        - name: keys
          in: query
          required: false
          schema:
            type: string
            maxLength: 1000
          description: Comma-separated block keys. Up to 50 keys.
        - name: type
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Block lookup result. `keys` returns BlocksByKey; `type` returns BlocksList.
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/ApiSuccess'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/BlocksByKey'
                  - allOf:
                      - $ref: '#/components/schemas/ApiSuccess'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/BlocksList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/commerce/orders:
    post:
      tags: [SSR]
      summary: Create an order using a server app token.
      description: Creates an order for the token-bound site. Use this from SSR storefront server routes, not browser code.
      security:
        - ServerAppBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: Created order.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/commerce/orders/{orderNo}:
    get:
      tags: [SSR]
      summary: Read an order using a server app token.
      description: Reads an order for the token-bound site.
      security:
        - ServerAppBearer: []
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/commerce/payments/create:
    post:
      tags: [SSR]
      summary: Create a provider payment using a server app token.
      description: Creates or reuses a PayPal order or Stripe PaymentIntent for the token-bound site.
      security:
        - ServerAppBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '200':
          description: Provider payment data for the browser payment SDK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreatePaymentResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/commerce/payments/capture:
    post:
      tags: [SSR]
      summary: Capture and verify payment using a server app token.
      description: Verifies the provider payment server-side. Returns the updated order when paid.
      security:
        - ServerAppBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapturePaymentRequest'
      responses:
        '200':
          description: Updated order after capture verification.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    ServerAppBearer:
      type: http
      scheme: bearer
      description: Site-scoped server app token such as `sk_live...`. Keep it on the SSR storefront server only.
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data: {}
    ApiError:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: false
        data:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
      example:
        success: false
        data: Unauthorized
    Currency:
      type: string
      enum: [USD, CNY, EUR, GBP, JPY, HKD, AUD, CAD, SGD]
    ProductSeo:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        description:
          type: string
        keywords:
          type: array
          items:
            type: string
        image:
          type: string
        canonicalPath:
          type: string
        noindex:
          type: boolean
    ProductReview:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        author:
          type: string
        avatar:
          type: string
        rating:
          type: number
        title:
          type: string
        content:
          type: string
        date:
          type: string
        purchased:
          type: string
        helpfulCount:
          type: number
        images:
          type: array
          items:
            type: string
        sourceReviewId:
          type: string
    ProductMeta:
      type: object
      additionalProperties: true
      properties:
        source:
          type: string
        sourceProductId:
          type: string
        sourceProductUrl:
          type: string
        seo:
          $ref: '#/components/schemas/ProductSeo'
        video:
          type: string
        sellingPoints:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        decoration:
          type: object
          additionalProperties: true
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ProductReview'
    ProductVariant:
      type: object
      required: [id, productId, site, sku, optionValues, decoration, price, stock, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        productId:
          type: string
        site:
          type: string
        sku:
          type: string
        optionValues:
          type: object
          additionalProperties:
            type: string
        decoration:
          type: object
          additionalProperties: true
        price:
          type: integer
          description: Minor currency unit, for example cents for USD.
        compareAtPrice:
          type: [integer, 'null']
        stock:
          type: integer
        image:
          type: [string, 'null']
        status:
          type: string
          enum: [active, inactive, archived]
        createdAt:
          type: string
        updatedAt:
          type: string
    Product:
      type: object
      required: [id, site, title, slug, status, currency, tags, galleryImages, mainImage, meta, content, createdAt, updatedAt, variants, minPrice, maxPrice, totalStock]
      properties:
        id:
          type: string
        site:
          type: string
        title:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active]
        currency:
          $ref: '#/components/schemas/Currency'
        tags:
          type: array
          items:
            type: string
        galleryImages:
          type: array
          items:
            type: string
        mainImage:
          type: [string, 'null']
        meta:
          $ref: '#/components/schemas/ProductMeta'
        content:
          type: [string, 'null']
        createdAt:
          type: string
        updatedAt:
          type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
        minPrice:
          type: integer
        maxPrice:
          type: integer
        totalStock:
          type: integer
    SiteMetadata:
      type: object
      required: [name, legalName, domain, logoUrl, logoAlt, supportEmail, privacyEmail, supportResponseTime, policyUpdatedAt, copyrightYear, cdnBaseUrl]
      properties:
        name:
          type: string
        legalName:
          type: string
        domain:
          type: string
        logoUrl:
          type: string
        logoAlt:
          type: string
        supportEmail:
          type: string
        privacyEmail:
          type: string
        supportResponseTime:
          type: string
        policyUpdatedAt:
          type: string
        copyrightYear:
          type: string
        cdnBaseUrl:
          type: string
    CommerceConfig:
      type: object
      required: [site, google, checkout, payments]
      properties:
        site:
          $ref: '#/components/schemas/SiteMetadata'
        google:
          type: object
          required: [gtmId]
          properties:
            gtmId:
              type: string
        checkout:
          type: object
          required: [successNotice]
          properties:
            successNotice:
              type: string
        payments:
          type: object
          required: [paypal, stripe]
          properties:
            paypal:
              type: object
              required: [enabled, creditCardEnabled, mode, clientId]
              properties:
                enabled:
                  type: boolean
                creditCardEnabled:
                  type: boolean
                mode:
                  type: string
                  enum: [sandbox, live]
                clientId:
                  type: string
            stripe:
              type: object
              required: [enabled, mode, publishableKey]
              properties:
                enabled:
                  type: boolean
                mode:
                  type: string
                  enum: [sandbox, live]
                publishableKey:
                  type: string
    CommerceConfigResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CommerceConfig'
    Block:
      type: object
      required: [key, type, meta, content, updatedAt]
      properties:
        key:
          type: string
        type:
          type: string
        meta:
          type: object
          additionalProperties: true
        content:
          type: string
        updatedAt:
          type: string
    BlocksByKey:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Block'
    BlocksList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Block'
        total:
          type: integer
    OrderCustomer:
      type: object
      required: [email, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          default: ''
        firstName:
          type: string
        lastName:
          type: string
    OrderAddress:
      type: object
      required: [address1, city, state, postalCode, country]
      properties:
        address1:
          type: string
        address2:
          type: string
          default: ''
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
          minLength: 2
          maxLength: 2
          example: US
    OrderItemInput:
      type: object
      required: [productSlug, sku, quantity]
      properties:
        productSlug:
          type: string
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
    CreateOrderRequest:
      type: object
      required: [customer, items]
      properties:
        customer:
          $ref: '#/components/schemas/OrderCustomer'
        billingAddress:
          $ref: '#/components/schemas/OrderAddress'
        billingAddressAsShippingAddress:
          type: boolean
          default: true
        shippingAddress:
          $ref: '#/components/schemas/OrderAddress'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemInput'
    OrderItem:
      type: object
      required: [id, orderId, site, productId, variantId, productSlug, productTitle, sku, optionValues, image, quantity, unitPrice, lineTotal, createdAt]
      properties:
        id:
          type: string
        orderId:
          type: string
        site:
          type: string
        productId:
          type: string
        variantId:
          type: string
        productSlug:
          type: string
        productTitle:
          type: string
        sku:
          type: string
        optionValues:
          type: object
          additionalProperties:
            type: string
        image:
          type: [string, 'null']
        quantity:
          type: integer
        unitPrice:
          type: integer
        lineTotal:
          type: integer
        createdAt:
          type: string
    OrderPayment:
      type: object
      required: [id, site, orderId, provider, fundingSource, providerOrderId, providerCaptureId, providerPayerId, status, amount, currency, createdAt, updatedAt]
      properties:
        id:
          type: string
        site:
          type: string
        orderId:
          type: string
        provider:
          type: string
          enum: [paypal, stripe]
        fundingSource:
          type: [string, 'null']
        providerOrderId:
          type: [string, 'null']
        providerCaptureId:
          type: [string, 'null']
        providerPayerId:
          type: [string, 'null']
        status:
          type: string
          enum: [created, approved, captured, failed, refunded]
        amount:
          type: integer
        currency:
          $ref: '#/components/schemas/Currency'
        createdAt:
          type: string
        updatedAt:
          type: string
    Order:
      type: object
      required: [id, site, orderNo, status, paymentStatus, currency, subtotalAmount, shippingAmount, taxAmount, totalAmount, itemCount, customer, billingAddress, shippingAddress, items, payments, createdAt, updatedAt]
      properties:
        id:
          type: string
        site:
          type: string
        orderNo:
          type: string
        status:
          type: string
          enum: [pending, processing, done, cancelled]
        paymentStatus:
          type: string
          enum: [unpaid, pending, paid, failed, refunded]
        currency:
          $ref: '#/components/schemas/Currency'
        subtotalAmount:
          type: integer
        shippingAmount:
          type: integer
        taxAmount:
          type: integer
        totalAmount:
          type: integer
        itemCount:
          type: integer
        customer:
          $ref: '#/components/schemas/OrderCustomer'
        billingAddress:
          $ref: '#/components/schemas/OrderAddress'
        shippingAddress:
          $ref: '#/components/schemas/OrderAddress'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/OrderPayment'
        createdAt:
          type: string
        updatedAt:
          type: string
    CreatePaymentRequest:
      type: object
      required: [orderNo, provider]
      properties:
        orderNo:
          type: string
        provider:
          type: string
          enum: [paypal, stripe]
        fundingSource:
          type: string
          description: PayPal only. Use `card` for PayPal Card Fields or `paypal` for wallet checkout.
    CreatePaymentResult:
      type: object
      required: [orderNo, provider, providerOrderId, currency, totalAmount, items]
      properties:
        orderNo:
          type: string
        provider:
          type: string
          enum: [paypal, stripe]
        fundingSource:
          type: [string, 'null']
        providerOrderId:
          type: string
        clientSecret:
          type: string
          description: Stripe only. Use with Stripe.js Payment Element.
        currency:
          $ref: '#/components/schemas/Currency'
        totalAmount:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    CapturePaymentRequest:
      type: object
      required: [orderNo, provider, providerOrderId]
      properties:
        orderNo:
          type: string
        provider:
          type: string
          enum: [paypal, stripe]
        providerOrderId:
          type: string
